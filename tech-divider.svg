<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="80"
  viewBox="0 0 1200 80"
>

  <defs>

    <linearGradient id="pinkLine">
      <stop offset="0%" stop-color="#f7b6df"/>
      <stop offset="50%" stop-color="#ff4fb3"/>
      <stop offset="100%" stop-color="#f7b6df"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- linha principal -->

  <line
    x1="40"
    y1="40"
    x2="1160"
    y2="40"
    stroke="url(#pinkLine)"
    stroke-width="2"
  />


  <!-- pequenos pontos de processamento -->

  <circle
    cx="180"
    cy="40"
    r="3"
    fill="#ff4fb3"
    filter="url(#glow)"
  />

  <circle
    cx="600"
    cy="40"
    r="3"
    fill="#ff4fb3"
    filter="url(#glow)"
  />

  <circle
    cx="1020"
    cy="40"
    r="3"
    fill="#ff4fb3"
    filter="url(#glow)"
  />


  <!-- código -->

  <g
    font-family="monospace"
    font-size="15"
    font-weight="bold"
    fill="#ff4fb3"
  >

    <text x="80" y="45">&lt;/&gt;</text>

    <text x="250" y="45">{ }</text>

    <text x="390" y="45">//</text>

    <text x="500" y="45">01</text>

    <text x="650" y="45">const</text>

    <text x="790" y="45">;</text>

    <text x="900" y="45">if()</text>

    <text x="1050" y="45">&lt;/&gt;</text>

  </g>

</svg>
